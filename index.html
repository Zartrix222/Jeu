<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#11161b">
</head>
<body>
<!--ART-START-->
<title>Usine Orbitale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
/* Layout : monde 3D plein écran, HUD flottant en haut, menu de construction en bas, panneau coulissant pour les détails. */
:root{
  --bg:#0d1115; --panel:rgba(20,26,32,.94); --panel2:#26303a; --panel3:#303b47; --line:#3a4653;
  --fg:#e9edf0; --muted:#8e9aa6; --accent:#f2a516; --accent-ink:#1b1305; --good:#5cc98a; --bad:#e4574a;
  --font-d:'Chakra Petch',ui-rounded,system-ui,sans-serif; --font-b:'Inter',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.35 var(--font-b);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

#hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:6px;align-items:center;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
.chip{pointer-events:auto;display:flex;align-items:center;gap:6px;height:38px;padding:0 10px;border-radius:10px;background:var(--panel);
  border:1px solid var(--line);font-family:var(--font-d);font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px)}
.chip.btn:active{transform:scale(.96)}
#pwChip{flex:1;min-width:0}
#pwChip .bar{flex:1;min-width:24px;height:7px;border-radius:4px;background:#0006;overflow:hidden}
#pwChip .bar i{display:block;height:100%;width:0;background:var(--good);transition:width .3s}
#pwChip.over .bar i{background:var(--bad)}
#pwTxt{font-size:12px;color:var(--muted)}
#goalBtn{background:var(--accent);color:var(--accent-ink);border-color:transparent}
#hint{position:fixed;z-index:4;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  top:calc(env(safe-area-inset-top,0px) + 54px);pointer-events:none;display:flex;justify-content:center}
#hint span{background:rgba(13,17,21,.8);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12.5px;color:#cfd6dc;max-width:520px;text-align:center;text-wrap:balance}

#dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);backdrop-filter:blur(8px);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(8px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
#tabs{display:flex;gap:4px}
#tabs button{flex:1;height:28px;border-radius:8px;font:700 12px var(--font-d);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid transparent}
#tabs button.on{color:var(--fg);background:var(--panel2);border-color:var(--line)}
.dockrow{display:flex;gap:8px;align-items:stretch}
#tools{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;width:68px;height:76px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;gap:1px;position:relative;padding-bottom:4px;overflow:hidden}
.tool>*{flex-shrink:0}
.tool img,.tool .ic{width:42px;height:42px;object-fit:contain;display:flex;align-items:center;justify-content:center;font-size:24px}
.tool .nm{font-size:9.5px;font-weight:600;color:#cdd5dc;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .cs{display:flex;gap:2px;font-size:8.5px;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.tool.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#3a2f17}
.tool.poor .cs{color:var(--bad)}
.tool.poor img{opacity:.6}
.tool.lock{opacity:.45}
.tool.lock::after{content:attr(data-lock);position:absolute;top:4px;right:5px;font:700 10px var(--font-d);color:var(--accent)}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:-1px;border:1px solid #0008;flex:0 0 auto}
.dot.s0{border-radius:50%}
.dot.s2{transform:rotate(45deg) scale(.85)}
.dot.s3{border-radius:50% 0 50% 50%;transform:rotate(-45deg)}
#rotBtn{flex:0 0 auto;width:56px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:var(--font-d);font-weight:700}
#rotBtn b{font-size:24px;line-height:1;color:var(--accent)}
#rotBtn small{font-size:10px;color:var(--muted);font-family:var(--font-b);font-weight:600}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-height:70%;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;box-shadow:0 -10px 30px #0008;padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(10px)}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.sh-h h2{flex:1;margin:0;font:700 19px/1.2 var(--font-d);letter-spacing:.02em;text-wrap:balance}
#sheetX{width:36px;height:36px;border-radius:10px;background:var(--panel2);font-size:16px}
#sheetBody{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;padding:7px 10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.pill.ok{border-color:#2f6b4a}
.pill.no{border-color:#6b2f2a}
.act{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:40px;padding:0 13px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:600}
.act.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.act.dng{border-color:#7a3530;color:#ffb3aa}
.act[disabled]{opacity:.4;pointer-events:none}
.act.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.act.sq{width:44px;padding:0;font-size:20px}
.status{font-family:var(--font-d);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.status::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.status.good{color:var(--good)} .status.bad{color:var(--bad)} .status.warn{color:var(--accent)}
.muted{margin:0;color:var(--muted);font-size:12.5px;max-width:65ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.inv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;background:var(--panel2);font-variant-numeric:tabular-nums;min-width:0}
.inv span{min-width:0}
.inv b{font-family:var(--font-d)}
.ms{padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ms.cur{border-color:var(--accent)}
.ms.done{opacity:.55}
.ms.fut{opacity:.7}
.ms h3{margin:0;font:700 16px var(--font-d)}
.ms p{margin:0;color:var(--muted);font-size:12.5px}
.prog{height:6px;border-radius:3px;background:#0006;overflow:hidden;flex:1;min-width:40px}
.prog i{display:block;height:100%;background:var(--accent)}
.req{display:flex;align-items:center;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.req span:first-child{width:140px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.help p{margin:0 0 8px;color:#cfd6dc;max-width:65ch}
.help b{color:var(--fg)}
#mapC{width:100%;max-width:360px;aspect-ratio:1;border-radius:10px;border:1px solid var(--line);align-self:center;image-rendering:pixelated;touch-action:none}
.ft{position:fixed;z-index:3;pointer-events:none;font:700 15px var(--font-d);text-shadow:0 1px 3px #000;transform:translate(-50%,-50%);white-space:nowrap}

#toast{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 140px);pointer-events:none;
  background:#0d1115ee;border:1px solid var(--line);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;opacity:0;transition:opacity .25s;max-width:86vw;text-align:center}
#toast.show{opacity:1}
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#05070acc;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.overlay>div{max-width:420px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.overlay h1{margin:0;font:700 32px/1.1 var(--font-d);color:var(--accent);text-wrap:balance;letter-spacing:.02em}
.overlay p{margin:0;color:#cfd6dc}
#splash{background:radial-gradient(circle at 50% 40%,#1d2a33,#07090c 70%)}
#splash small{color:var(--muted);font-family:var(--font-d);letter-spacing:.2em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="cv"></canvas>
<div id="hud">
  <div class="chip" id="pwChip" title="Énergie"><span>⚡</span><div class="bar"><i id="pwBar"></i></div><span id="pwTxt">0/30 MW</span></div>
  <button class="chip btn" id="goalBtn" aria-label="Objectifs">🎯 <span id="goalTxt">P1</span></button>
  <button class="chip btn" id="invBtn" aria-label="Inventaire">🎒</button>
  <button class="chip btn" id="statBtn" aria-label="Carte et statistiques">🗺️</button>
  <button class="chip btn" id="menuBtn" aria-label="Menu">☰</button>
</div>
<div id="hint"><span id="hintTxt"></span></div>
<div id="dock">
  <div id="tabs">
    <button data-cat="prod" class="on">Production</button>
    <button data-cat="log">Logistique</button>
    <button data-cat="pow">Énergie</button>
  </div>
  <div class="dockrow">
    <div id="tools"></div>
    <button id="rotBtn" aria-label="Tourner"><b id="rotArrow">→</b><small>Tourner</small></button>
  </div>
</div>
<div id="sheet" hidden>
  <div class="sh-h"><h2 id="sheetTitle"></h2><button id="sheetX" aria-label="Fermer">✕</button></div>
  <div id="sheetBody"></div>
</div>
<div id="toast"></div>
<div id="win" class="overlay" hidden><div>
  <h1>Projet Ascension réussi</h1>
  <p>La fusée a quitté l’orbite. Ton usine continue de tourner : agrandis-la autant que tu veux.</p>
  <button class="act pri" id="winOk">Continuer à construire</button>
</div></div>
<div id="splash" class="overlay"><div>
  <small>Planète FX-7 · Base orbitale</small>
  <h1>Usine Orbitale</h1>
  <p id="splashTxt">Préparation du terrain…</p>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
if (!window.THREE) { $('splashTxt').textContent = 'Impossible de charger le moteur 3D. Vérifie ta connexion puis recharge la page.'; return; }
const T = window.THREE;

/* =====================================================================
   DONNÉES
   ===================================================================== */
const W = 72, H = 72;
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
const ARROWS = ['→', '↓', '←', '↑'];
const SAVE_KEY = 'usine-orbitale-v2';
const HUB_POWER = 30, STORAGE_CAP = 400, MINER_BUF = 10, DAY = 480;

// s : 0 minerai, 1 lingot/bloc, 2 pièce, 3 fluide
const ITEMS = {
  iron_ore:    { n: 'Minerai de fer',    c: '#b3573f', s: 0 },
  copper_ore:  { n: 'Minerai de cuivre', c: '#e0883a', s: 0 },
  limestone:   { n: 'Calcaire',          c: '#e3dcc4', s: 0 },
  coal:        { n: 'Charbon',           c: '#2a2a30', s: 0 },
  quartz:      { n: 'Quartz brut',       c: '#e7a8d8', s: 0 },
  oil:         { n: 'Pétrole brut',      c: '#2a1c24', s: 3, f: 1 },
  iron_ingot:  { n: 'Lingot de fer',     c: '#a7b0b9', s: 1 },
  copper_ingot:{ n: 'Lingot de cuivre',  c: '#d4733a', s: 1 },
  steel_ingot: { n: 'Lingot d’acier',    c: '#5d6670', s: 1 },
  plate:       { n: 'Plaque de fer',     c: '#d0d7de', s: 2 },
  rod:         { n: 'Tige de fer',       c: '#7f8c98', s: 2 },
  screw:       { n: 'Vis',               c: '#b7c0c8', s: 2 },
  wire:        { n: 'Fil de cuivre',     c: '#f0ad66', s: 2 },
  cable:       { n: 'Câble',             c: '#3f7cc0', s: 2 },
  concrete:    { n: 'Béton',             c: '#9b9a93', s: 1 },
  rplate:      { n: 'Plaque renforcée',  c: '#6c90b4', s: 2 },
  rotor:       { n: 'Rotor',             c: '#d2aa2b', s: 2 },
  steel_beam:  { n: 'Poutre d’acier',    c: '#4a525c', s: 2 },
  steel_pipe:  { n: 'Tube d’acier',      c: '#8a949e', s: 2 },
  crystal:     { n: 'Cristal de quartz', c: '#f3c6ef', s: 2 },
  frame:       { n: 'Cadre modulaire',   c: '#8b6cc2', s: 2 },
  motor:       { n: 'Moteur',            c: '#d2503a', s: 2 },
  plastic:     { n: 'Plastique',         c: '#5fb7d6', s: 1 },
  rubber:      { n: 'Caoutchouc',        c: '#45484d', s: 1 },
  fuel:        { n: 'Carburant',         c: '#f0a020', s: 3, f: 1 },
  circuit:     { n: 'Circuit imprimé',   c: '#3aa35a', s: 2 },
  computer:    { n: 'Ordinateur',        c: '#2fd0c0', s: 2 },
};
const NODE_TYPES = ['iron_ore', 'copper_ore', 'limestone', 'coal', 'quartz', 'oil'];
const RICH = [{ n: 'Pauvre', m: 0.5 }, { n: 'Normal', m: 1 }, { n: 'Riche', m: 2 }];
const isFluid = i => !!(ITEMS[i] && ITEMS[i].f);

const RECIPES = {
  smelter: [
    { id: 'iron_ingot',   in: { iron_ore: 1 },   out: ['iron_ingot', 1],   t: 2 },
    { id: 'copper_ingot', in: { copper_ore: 1 }, out: ['copper_ingot', 1], t: 2 },
  ],
  foundry: [
    { id: 'steel_ingot', in: { iron_ore: 3, coal: 3 }, out: ['steel_ingot', 3], t: 6, tier: 4 },
  ],
  constructor: [
    { id: 'plate',      in: { iron_ingot: 3 },   out: ['plate', 2],      t: 4 },
    { id: 'rod',        in: { iron_ingot: 1 },   out: ['rod', 1],        t: 3 },
    { id: 'screw',      in: { rod: 1 },          out: ['screw', 4],      t: 4, tier: 1 },
    { id: 'wire',       in: { copper_ingot: 1 }, out: ['wire', 2],       t: 3, tier: 2 },
    { id: 'cable',      in: { wire: 2 },         out: ['cable', 1],      t: 2, tier: 2 },
    { id: 'concrete',   in: { limestone: 3 },    out: ['concrete', 1],   t: 4, tier: 2 },
    { id: 'steel_beam', in: { steel_ingot: 4 },  out: ['steel_beam', 1], t: 4, tier: 4 },
    { id: 'steel_pipe', in: { steel_ingot: 3 },  out: ['steel_pipe', 2], t: 6, tier: 4 },
    { id: 'crystal',    in: { quartz: 5 },       out: ['crystal', 3],    t: 8, tier: 5 },
  ],
  assembler: [
    { id: 'rplate',  in: { plate: 4, screw: 10 },      out: ['rplate', 1],  t: 10, tier: 3 },
    { id: 'rotor',   in: { rod: 4, screw: 20 },        out: ['rotor', 1],   t: 12, tier: 3 },
    { id: 'frame',   in: { rplate: 3, steel_beam: 3 }, out: ['frame', 2],   t: 20, tier: 5 },
    { id: 'motor',   in: { rotor: 2, steel_pipe: 4 },  out: ['motor', 1],   t: 12, tier: 5 },
    { id: 'circuit', in: { plastic: 2, wire: 8 },      out: ['circuit', 1], t: 8,  tier: 7 },
  ],
  refinery: [
    { id: 'plastic', in: { oil: 3 }, out: ['plastic', 2], t: 6, tier: 6 },
    { id: 'rubber',  in: { oil: 3 }, out: ['rubber', 2],  t: 6, tier: 6 },
    { id: 'fuel',    in: { oil: 6 }, out: ['fuel', 4],    t: 6, tier: 6 },
  ],
  manufacturer: [
    { id: 'computer', in: { circuit: 4, cable: 8, plastic: 12, crystal: 2 }, out: ['computer', 1], t: 24, tier: 7 },
  ],
};
const RMAP = {};
for (const k in RECIPES) for (const r of RECIPES[k]) RMAP[k + ':' + r.id] = r;

const BUILD = {
  miner:       { n: 'Foreuse Mk1', cat: 'prod', cost: { plate: 6, rod: 2 }, power: 5, rate: 0.5,
                 d: 'À poser sur un gisement solide. 30 minerais/min sur un gisement normal.' },
  miner2:      { n: 'Foreuse Mk2', cat: 'prod', cost: { rplate: 4, concrete: 10, cable: 8 }, power: 12, rate: 1, tier: 4,
                 d: '60 minerais/min. Pose-la sur une Foreuse Mk1 pour l’améliorer.' },
  miner3:      { n: 'Foreuse Mk3', cat: 'prod', cost: { frame: 4, motor: 2, steel_pipe: 10 }, power: 30, rate: 2, tier: 7,
                 d: '120 minerais/min. Pose-la sur une foreuse existante pour l’améliorer.' },
  oilpump:     { n: 'Extracteur de pétrole', cat: 'prod', cost: { motor: 4, steel_pipe: 10, concrete: 20 }, power: 30, rate: 2, tier: 6,
                 d: 'À poser sur une nappe de pétrole. Sort le pétrole dans un tuyau.' },
  smelter:     { n: 'Fonderie', cat: 'prod', cost: { plate: 3, rod: 5 }, power: 4,
                 d: 'Fond le minerai de fer ou de cuivre en lingots. Choisit sa recette selon le minerai reçu.' },
  foundry:     { n: 'Haut fourneau', cat: 'prod', cost: { rplate: 4, concrete: 20, rod: 20 }, power: 16, tier: 4,
                 d: 'Fond minerai de fer + charbon en lingots d’acier.' },
  constructor: { n: 'Constructeur', cat: 'prod', cost: { plate: 6, rod: 6 }, power: 4,
                 d: 'Transforme un type d’objet en pièce. Touche-le pour choisir la recette.' },
  assembler:   { n: 'Assembleuse', cat: 'prod', cost: { plate: 20, screw: 40, cable: 10 }, power: 15, tier: 3,
                 d: 'Combine deux types d’objets. Touche-la pour choisir la recette.' },
  refinery:    { n: 'Raffinerie', cat: 'prod', cost: { motor: 5, steel_pipe: 15, concrete: 30 }, power: 30, tier: 6,
                 d: 'Raffine le pétrole en plastique, caoutchouc ou carburant (sortie par tuyau).' },
  manufacturer:{ n: 'Usine lourde', cat: 'prod', cost: { frame: 10, motor: 5, cable: 50 }, power: 55, tier: 7,
                 d: 'Combine jusqu’à quatre ingrédients. Produit les ordinateurs.' },
  belt:        { n: 'Convoyeur Mk1', cat: 'log', cost: { plate: 1 }, speed: 1.6,
                 d: 'Glisse le doigt pour tracer une ligne. ~90 objets/min.' },
  belt2:       { n: 'Convoyeur Mk2', cat: 'log', cost: { plate: 1, screw: 4 }, speed: 3.2, tier: 3,
                 d: '~190 objets/min. Trace-le par-dessus un convoyeur pour l’améliorer.' },
  belt3:       { n: 'Convoyeur Mk3', cat: 'log', cost: { steel_beam: 1, plate: 1 }, speed: 5, tier: 5,
                 d: '~300 objets/min. Trace-le par-dessus un convoyeur pour l’améliorer.' },
  pipe:        { n: 'Tuyau', cat: 'log', cost: { steel_pipe: 1 }, speed: 4, tier: 6,
                 d: 'Transporte les fluides (pétrole, carburant). Se trace comme un convoyeur.' },
  splitter:    { n: 'Répartiteur', cat: 'log', cost: { plate: 2, rod: 2 }, tier: 1,
                 d: 'Distribue les objets à tour de rôle devant, à gauche et à droite.' },
  storage:     { n: 'Conteneur', cat: 'log', cost: { plate: 10, rod: 6 }, tier: 1,
                 d: 'Stocke 400 objets et les ressort vers l’avant s’il y a un convoyeur.' },

let S = null, list = [], hub = null;

function rng(seed) {

/* ---------- Génération de la planète ---------- */
function genMap(seed) {
  nodes.fill(0); nodeRich.fill(0); water.fill(0);
  const R = rng(seed);
  const hx = W >> 1, hy = H >> 1;
  const nearHub = (x, y, r) => Math.abs(x - hx) <= r && Math.abs(y - hy) <= r;
  for (let i = 0; i < 6; i++) {
    let cx, cy, k = 0;
    do { cx = 6 + R() * (W - 12); cy = 6 + R() * (H - 12); k++; } while (Math.hypot(cx - hx, cy - hy) < 16 && k < 40);
    const r = 2 + R() * 2.6;
    for (let y = Math.floor(cy - r - 2); y <= cy + r + 2; y++) for (let x = Math.floor(cx - r - 2); x <= cx + r + 2; x++) {
      if (!inb(x, y)) continue;
      const a = Math.atan2(y - cy, x - cx);
      if (Math.hypot(x - cx, y - cy) < r * (0.85 + 0.25 * Math.sin(a * 3 + i))) water[idx(x, y)] = 1;
    }
  }
  const blob = (cx, cy, type, r, rich) => {
    for (let y = Math.floor(cy - r - 1); y <= cy + r + 1; y++)
      for (let x = Math.floor(cx - r - 1); x <= cx + r + 1; x++) {
        if (!inb(x, y) || nearHub(x, y, 3) || water[idx(x, y)]) continue;
        if (Math.hypot(x - cx, y - cy) < r * (0.75 + R() * 0.45)) { nodes[idx(x, y)] = type + 1; nodeRich[idx(x, y)] = rich; }
      }
  };

  for (const [t, ox, oy] of near) blob(hx + ox + (R() * 2 - 1), hy + oy + (R() * 2 - 1), t, t === 5 ? 1.3 : 1.8 + R() * 0.6, 1);
  const counts = [12, 9, 8, 8, 6, 5];
  counts.forEach((c, t) => {
    for (let i = 0; i < c; i++) {
      let x, y, tries = 0;
      do { x = 3 + R() * (W - 6); y = 3 + R() * (H - 6); tries++; } while (Math.hypot(x - hx, y - hy) < 12 && tries < 50);
      const q = R(); const rich = q < .2 ? 0 : q < .75 ? 1 : 2;
      blob(x, y, t, t === 5 ? 1 + R() * 1.2 : 1.4 + R() * 1.9, rich);
    }

  const fN = makeNoise(seed ^ 0x51ed);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = idx(x, y);
    if (nodes[i] || water[i] || nearHub(x, y, 4)) continue;
    const f = fN(x * .09, y * .09);
    const p = f > .58 ? .45 : .04;
    if (R() < p) {
      trees.push({ x: x + .25 + R() * .5, z: y + .25 + R() * .5, t: f > .6 && R() < .5 ? 1 : (R() < .25 ? 1 : 0), s: .7 + R() * .7, r: R() * 6.28, c: (R() * 3) | 0, i });
      treeAt[i] = trees.length;
    }
  }
}

const ptrs = new Map();
let gesture = null;
cv.addEventListener('pointerdown', e => {
  Snd.init();
  try { cv.setPointerCapture(e.pointerId); } catch (er) { }
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) { gesture = { type: 'pinch' }; hover = null; }
  else if (ptrs.size === 1) {
    const [tx, ty] = tileAt(e.clientX, e.clientY);
    gesture = { type: 'tap', x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY, tx, ty, paints: isLine(tool) || tool === 'delete', placed: new Set() };
    if (BUILD[tool]) hover = [tx, ty];
  }
});
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p) { if (e.pointerType === 'mouse' && BUILD[tool]) hover = tileAt(e.clientX, e.clientY); return; }
  const prev = [...ptrs.values()].map(q => ({ x: q.x, y: q.y }));
  p.x = e.clientX; p.y = e.clientY;
  if (!gesture) return;
  if (gesture.type === 'pinch' && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()], [pa, pb] = prev;
    const m0x = (pa.x + pb.x) / 2, m0y = (pa.y + pb.y) / 2, m1x = (a.x + b.x) / 2, m1y = (a.y + b.y) / 2;
    const g0 = ground(m0x, m0y);
    const d0 = Math.hypot(pa.x - pb.x, pa.y - pb.y) || 1, d1 = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const a0 = Math.atan2(pb.y - pa.y, pb.x - pa.x), a1 = Math.atan2(b.y - a.y, b.x - a.x);
    cam.dist *= d0 / d1; let da = a1 - a0; if (da > PI) da -= 2 * PI; if (da < -PI) da += 2 * PI; cam.yaw += da;
    updateCamera();
    const g1 = ground(m1x, m1y);
    if (g0 && g1) { cam.tx += g0.x - g1.x; cam.tz += g0.z - g1.z; updateCamera(); }
    return;
  }
  if (gesture.type === 'tap' && Math.hypot(e.clientX - gesture.x0, e.clientY - gesture.y0) > 10) {
    if (gesture.paints) { gesture.type = 'paint'; startPaint(); }
    else { gesture.type = 'pan'; hover = null; }
  }
  if (gesture.type === 'pan') {
    const g0 = ground(gesture.lx, gesture.ly), g1 = ground(e.clientX, e.clientY);
    if (g0 && g1) { cam.tx += g0.x - g1.x; cam.tz += g0.z - g1.z; updateCamera(); }
  } else if (gesture.type === 'paint') {
    const [tx, ty] = tileAt(e.clientX, e.clientY); paintTo(tx, ty); hover = [tx, ty];
  }
  gesture.lx = e.clientX; gesture.ly = e.clientY;
});
function endPtr(e) {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (gesture && gesture.type === 'tap' && ptrs.size === 0) onTap(gesture.tx, gesture.ty);
  if (ptrs.size === 0) { gesture = null; if (e.pointerType !== 'mouse') hover = null; }
  else if (gesture && gesture.type === 'pinch') { const q = [...ptrs.values()][0]; gesture = { type: 'pan', lx: q.x, ly: q.y }; }
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); if (!ptrs.size) gesture = null; });
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hover = null; });
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const g0 = ground(e.clientX, e.clientY);
  if (e.shiftKey) cam.yaw += e.deltaY * .003; else cam.dist *= Math.exp(e.deltaY * .0012);
  updateCamera();
  const g1 = ground(e.clientX, e.clientY);
  if (g0 && g1 && !e.shiftKey) { cam.tx += g0.x - g1.x; cam.tz += g0.z - g1.z; updateCamera(); }
}, { passive: false });
window.addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') rotateTool(); if (e.key === 'Escape') { selectTool('inspect'); closeSheet(); } });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

function startPaint() {
  const g = gesture;
  g.lx2 = g.tx; g.ly2 = g.ty;
  if (tool === 'delete') { const b = at(g.tx, g.ty); if (b) demolish(b); return; }
  const b = tryPlace(tool, g.tx, g.ty, S.rot, false);
  if (b && isLine(b.k)) g.placed.add(b);
}
function paintTo(tx, ty) {
  const g = gesture; let guard = 0, warned = false;
  while ((g.lx2 !== tx || g.ly2 !== ty) && guard++ < 200) {
    const dx = tx - g.lx2, dy = ty - g.ly2;
    let mx = 0, my = 0;
    if (Math.abs(dx) >= Math.abs(dy)) mx = Math.sign(dx); else my = Math.sign(dy);
    const d = mx === 1 ? 0 : my === 1 ? 1 : mx === -1 ? 2 : 3;
    if (tool === 'delete') { g.lx2 += mx; g.ly2 += my; const b = at(g.lx2, g.ly2); if (b) demolish(b); continue; }
    const prev = at(g.lx2, g.ly2);
    if (prev && g.placed.has(prev)) { prev.d = d; staticDirty = true; }
    g.lx2 += mx; g.ly2 += my;
    S.rot = d; updateRot();
    const cur = at(g.lx2, g.ly2);
    if (!cur || upgradeOf(tool, cur)) {
      const b = tryPlace(tool, g.lx2, g.ly2, d, true);
      if (b) g.placed.add(b);
      else if (!warned && !afford(BUILD[tool].cost)) { warned = true; toast('Plus assez de ressources pour continuer la ligne'); }
    }
  }
}
function onTap(tx, ty) {
  if (!inb(tx, ty)) return;
  const b = at(tx, ty);
  if (tool === 'inspect') {
    if (b) { Snd.tap(); openBuilding(b); }
    else if (nodes[idx(tx, ty)] && nodeItem(tx, ty) !== 'oil') {
      const it = nodeItem(tx, ty); give(it, 1); Snd.mine();
      floatTxt(tx + .5, ty + .5, '+1 ' + ITEMS[it].n, it === 'coal' ? '#cfd6dc' : ITEMS[it].c);
      const col = new T.Color(ITEMS[it].c).toArray();
      for (let i = 0; i < 5; i++) emit(tx + .5, .3, ty + .5, { vx: (Math.random() - .5) * 2, vy: 1.5 + Math.random(), vz: (Math.random() - .5) * 2, g: 6, max: .6, s0: .14, s1: .1, a: 1, c: col });
      if (!S.handHint) { S.handHint = 1; toast('Gisement ' + RICH[nodeRich[idx(tx, ty)]].n.toLowerCase() + ' · transforme le minerai à l’établi 🎒', 3000); }
      dirtyTools = true;
    } else if (nodes[idx(tx, ty)]) toast('Nappe de pétrole (' + RICH[nodeRich[idx(tx, ty)]].n.toLowerCase() + ') · il faut un Extracteur');
    else if (sheetMode) closeSheet();
    return;
  }
  if (tool === 'delete') { if (b) demolish(b); return; }
  if (tryPlace(tool, tx, ty, S.rot, false)) hover = null;
}

const floats = [];

  if (sheetMode === 'stats') drawMap($('mapC'));
}
function clockTxt() { const ph = ((S.clock / DAY) % 1 + .25) % 1, m = Math.floor(ph * 24 * 60); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
function drawMap(c) {
  if (!c) return; const g = c.getContext('2d'), s = 4;
  g.fillStyle = '#3a4a34'; g.fillRect(0, 0, 288, 288);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = idx(x, y);
    let col = null;
    if (water[i]) col = '#2f86a6'; else if (nodes[i]) col = ITEMS[nodeItem(x, y)].c; else if (treeAt[i] && !cut.has(i)) col = '#2f5a3c';
    const b = grid[i];
    if (b) col = b.k === 'hub' ? '#f2a516' : isBelt(b.k) ? '#20242a' : b.k === 'pipe' ? '#dfe3e7' : '#e8892b';
    if (col) { g.fillStyle = col; g.fillRect(x * s, y * s, s, s); }
  }
  g.strokeStyle = '#fff'; g.lineWidth = 2; g.beginPath(); g.arc(cam.tx * s, cam.tz * s, cam.dist * 1.2, 0, 7); g.stroke();
}
let resetArm = false;
sheetBody.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const [a, p1, p2] = el.dataset.act.split(':');
  const b = selected;
  Snd.tap();
  if (a === 'map') { const r = el.getBoundingClientRect(); cam.tx = (e.clientX - r.left) / r.width * W; cam.tz = (e.clientY - r.top) / r.height * H; updateCamera(); closeSheet(); return; }
  if (a === 'recipe' && b && b.r !== p1) { for (const i in b.ib) give(i, b.ib[i]); const r = recipeOf(b); if (r) give(r.out[0], b.on); b.ib = {}; b.on = 0; b.cr = false; b.p = 0; b.r = p1; }
  if (a === 'oc' && b) b.oc = Math.max(.5, Math.min(2.5, b.oc + (p1 === '+' ? .25 : -.25)));
  if (a === 'rotate' && b) { b.d = (b.d + 1) % 4; staticDirty = true; }
  if (a === 'demolish' && b) { demolish(b); return; }
  if (a === 'empty' && b) { for (const i in b.st) give(i, b.st[i]); b.st = {}; b.cnt = 0; toast('Contenu transféré vers l’inventaire'); }
  if (a === 'milestone') completeMilestone();
  if (a === 'hand') {
    const c = HAND.filter(q => (q.tier || 0) <= S.tier)[+p1], n = +p2;
    if (c && afford(c.in, n)) { for (const i in c.in) S.inv[i] -= c.in[i] * n; give(c.out, c.n * n); toast(`+${c.n * n} ${ITEMS[c.out].n}`); }
  }
  if (a === 'sound') { Snd.init(); Snd.set(!Snd.on); try { localStorage.setItem('uo-sound', Snd.on ? '1' : '0'); } catch (er) { } }
  if (a === 'quality') { try { localStorage.setItem('uo-quality', quality ? '0' : '1'); } catch (er) { } save(); toast('Rechargement…'); setTimeout(() => location.reload(), 300); return; }
  if (a === 'save') { save(); toast('Partie sauvegardée'); }
  if (a === 'center') { cam.tx = W / 2; cam.tz = H / 2 + 1; cam.yaw = 0; cam.dist = 17; updateCamera(); closeSheet(); return; }
  if (a === 'reset') {
    if (!resetArm) { resetArm = true; setTimeout(() => { resetArm = false; if (sheetMode === 'menu') renderSheet(); }, 4000); }
    else { resetArm = false; newGame(); closeSheet(); toast('Nouvelle planète générée'); return; }
  }
  dirtyTools = true;
  if (sheetMode) renderSheet();
});
function completeMilestone() {
  const m = MILESTONES[S.tier]; if (!m || !afford(m.req)) return;
  pay(m.req); S.tier++;
  Snd.ms();
  if (hubGroup) for (let i = 0; i < 40; i++) emit(hubGroup.position.x, 3, hubGroup.position.z, { vx: (Math.random() - .5) * 6, vy: 3 + Math.random() * 4, vz: (Math.random() - .5) * 6, g: 6, max: 1.4, s0: .25, s1: .1, a: 1, c: [1, .7 + Math.random() * .3, .2] });
  if (S.tier >= MILESTONES.length) { S.won = true; startLaunch(); }
  else toast('Palier « ' + m.n + ' » validé ! Débloqué : ' + unlocksOf(S.tier), 4500);
  dirtyTools = true; save();
}
$('winOk').addEventListener('click', () => { $('win').hidden = true; });

function updateHUD() {
  const p = power;
  $('pwTxt').textContent = Math.round(p.demand) + '/' + p.supply + ' MW';
  $('pwBar').style.width = Math.min(100, p.demand / p.supply * 100) + '%';
  $('pwChip').classList.toggle('over', p.demand > p.supply);
  const m = MILESTONES[S.tier];
  $('goalTxt').textContent = m ? 'P' + (S.tier + 1) + (afford(m.req) ? ' ✓' : '') : '★';
  const ht = hintText(); $('hintTxt').textContent = ht; $('hint').hidden = !ht;
}
function hintText() {
  const has = k => list.some(b => b.k === k);
  if (BUILD[tool]) {
    if (isLine(tool)) return 'Glisse le doigt pour tracer · deux doigts pour déplacer la vue';
    return 'Touche le sol pour poser · sortie ' + ARROWS[S.rot] + ' (bouton Tourner)';
  }
  if (tool === 'delete') return 'Touche ou glisse sur ce que tu veux démolir';
  if (S.tier === 0) {
    if (!has('miner')) return '① Choisis la Foreuse et pose-la sur un gisement de fer (roches rouille).';
    if (!has('smelter')) return '② Pose une Fonderie et relie la foreuse avec des Convoyeurs (onglet Logistique).';
    if (!has('constructor')) return '③ Un Constructeur transforme les lingots en Plaques ou en Tiges.';
    if (!S.made.plate && !S.made.rod) return '④ Relie la sortie du Constructeur au QG 🚀 au centre.';
  }
  const mm = MILESTONES[S.tier];
  if (!mm) return '';
  if (afford(mm.req)) return 'Palier prêt ! Touche 🎯 pour le valider.';
  if (power.demand > power.supply) return 'Manque d’énergie : les machines ralentissent. Construis des centrales.';
  return 'Palier ' + (S.tier + 1) + ' · ' + Object.entries(mm.req).map(([i, n]) => ITEMS[i].n + ' ' + Math.min(n, inv(i)) + '/' + n).join(' · ');
}

/* ---------- Vignettes 3D du menu ---------- */
function makeThumbs() {
  try {
    const r = new T.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
    r.setSize(96, 96); r.setPixelRatio(1);
    const sc = new T.Scene(); sc.add(new T.HemisphereLight(0xdfeaff, 0x40342a, .9));
    const dl = new T.DirectionalLight(0xffffff, .9); dl.position.set(2, 4, 3); sc.add(dl);
    const c = new T.PerspectiveCamera(30, 1, .1, 20);
    for (const k in BUILD) {
      if (!TPL[k]) continue;
      const g = new T.Group(); g.add(new T.Mesh(TPL[k].geo, MAT.static));
      if (isBelt(k)) g.add(new T.Mesh(beltTopGeo, beltMats[k === 'belt' ? 0 : k === 'belt2' ? 1 : 2]));
      for (const a of TPL[k].anim || []) {
        const m = new T.Mesh(a.pool === 'drill' ? drillGeo : a.pool === 'gear' ? gearGeo : beamGeo, MAT.static);
        m.position.set(...a.p); m.scale.setScalar(a.s || 1); g.add(m);
      }
      sc.add(g);
      const box = new T.Box3().setFromObject(g), ctr = box.getCenter(new T.Vector3()), sz = box.getSize(new T.Vector3()).length();
      c.position.set(ctr.x + sz * 1.35, ctr.y + sz * 1.05, ctr.z + sz * 1.6); c.lookAt(ctr);
      r.render(sc, c); THUMB[k] = r.domElement.toDataURL();
      sc.remove(g);
    }
    r.dispose(); if (r.forceContextLoss) r.forceContextLoss();
  } catch (e) { }
}

/* =====================================================================
   SAUVEGARDE
   ===================================================================== */
function serialize() {
  return { v: 2, S, cut: [...cut], cam: { ...cam }, b: list.filter(b => b.k !== 'hub').map(b => { const o = { ...b }; delete o.born; delete o.spin; delete o.working; return o; }) };
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(serialize())); } catch (e) { } }
function freshState() { return { seed: (Math.random() * 1e9) | 0, tier: 0, inv: { plate: 40, rod: 24 }, rot: 0, made: {}, won: false, handHint: 0, clock: DAY * .08 }; }
function placeHub() { hub = make('hub', (W >> 1) - 1, (H >> 1) - 1, 0); hub.born = -9; addB(hub); }
function setupWorld() {
  list = []; grid.fill(null); cut = new Set();
  genMap(S.seed); buildWorld(S.seed); placeHub();
}
function loadData(d) {
  try {
    if (!d || d.v !== 2 || !d.S) return false;
    S = Object.assign(freshState(), d.S);
    setupWorld();
    cut = new Set(d.cut || []); treesDirty = true;
    for (const b of d.b) if (BUILD[b.k] && inb(b.x, b.y) && !at(b.x, b.y)) { b.born = -9; b.oc = b.oc || 1; addB(b); }
    Object.assign(cam, d.cam || {});
    if (S.won && rocket) rocket.visible = false;
    return true;
  } catch (e) { console.error(e); return false; }
}
function newGame() {
  S = freshState(); setupWorld();
  cam.tx = W / 2; cam.tz = H / 2 + 1; cam.yaw = 0; cam.dist = 45; intro = 1;
  selectTool('inspect'); dirtyTools = true; updateRot(); save();
}

/* =====================================================================
   BOUCLE
   ===================================================================== */
let last = 0, uiT = 0, saveT = 0, intro = 0;
function frame(t) {
  const dt = Math.min(0.25, (t - last) / 1000 || 0); last = t;
  let rem = dt; while (rem > 0) { const d = Math.min(0.05, rem); step(d); rem -= d; }
  if (intro) { cam.dist += (17 - cam.dist) * Math.min(1, dt * 1.6); if (Math.abs(cam.dist - 17) < .1) intro = 0; }
  updLaunch(dt); updateCamera(); updateDay();
  if (treesDirty) rebuildTrees();
  if (staticDirty) rebuildStatic();
  updateDynamic(dt);
  beltMats.forEach((m, i) => { m.map.offset.x = (m.map.offset.x - dt * [1.6, 3.2, 5][i] * 2) % 1; });
  if (MAT.water) MAT.water.opacity = .82 + Math.sin(time * 1.3) * .04;
  updateGhost();
  if (selected && list.includes(selected)) {
    const sz = BUILD[selected.k].size || 1;
    selMesh.visible = true; selMesh.position.set(selected.x + sz / 2, .03, selected.y + sz / 2); selMesh.scale.setScalar(sz * (1 + Math.sin(time * 5) * .03));
  } else selMesh.visible = false;
  updParts(dt); updFloats(dt);
  renderer.render(scene, camera);
  uiT += dt; saveT += dt;
  if (dirtyTools) buildTools();

    uiT = 0; updateHUD(); refreshAfford(); Snd.setHum(humCount);
    if (sheetMode && !sheetPress) renderSheet();
  }
  if (saveT > 20) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}

function start(hot) {
  resize();
  window.addEventListener('resize', resize);
  makeThumbs();
  let ok = hot && loadData(hot);
  if (!ok) { try { ok = loadData(JSON.parse(localStorage.getItem(SAVE_KEY) || 'null')); } catch (e) { ok = false; } }
  if (!ok) { newGame(); setTimeout(() => toast('Bienvenue sur FX-7 ! Suis les consignes en haut de l’écran.', 3800), 900); }
  updateRot(); buildTools(); updateCamera(); updateHUD();
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => serialize()); } catch (e) { }
  $('splash').hidden = true;
  requestAnimationFrame(tt => { last = tt; frame(tt); });
}
if (location.hash === '#test') window.__t = { tryPlace, step, get list() { return list; }, get S() { return S; }, hub: () => hub, nodes, NODE_TYPES, nodeRich, water, W, power: () => power, completeMilestone, cam, updateCamera };
setTimeout(() => {
  try {
    const hotApi = window.claude && window.claude.hot;
    if (hotApi && hotApi.ready) hotApi.ready(start); else start(hotApi && hotApi.data);
  } catch (e) { console.error(e); $('splashTxt').textContent = 'Erreur au démarrage : ' + e.message; }
}, 30);
})();
