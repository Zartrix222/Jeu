<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#11161b">
</head>
<body>
<!--ART-START-->
<title>Usine Orbitale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
/* Layout : carte plein écran (canvas), HUD flottant en haut, dock d'outils en bas, panneau coulissant pour les détails. */
:root{
  --bg:#0d1115; --ground:#1f2a26; --panel:rgba(22,28,34,.94); --panel2:#26303a; --line:#3a4653;
  --fg:#e9edf0; --muted:#8e9aa6; --accent:#f2a516; --accent-ink:#1b1305; --good:#5cc98a; --bad:#e4574a;
  --font-d:'Chakra Petch',ui-rounded,system-ui,sans-serif; --font-b:'Inter',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.35 var(--font-b);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:6px;align-items:center;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
.chip{pointer-events:auto;display:flex;align-items:center;gap:6px;height:38px;padding:0 11px;border-radius:10px;background:var(--panel);
  border:1px solid var(--line);font-family:var(--font-d);font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.btn:active{transform:scale(.96)}
#pwChip{flex:1;min-width:0}
#pwChip .bar{flex:1;min-width:30px;height:7px;border-radius:4px;background:#0006;overflow:hidden}
#pwChip .bar i{display:block;height:100%;width:0;background:var(--good);transition:width .3s}
#pwChip.over .bar i{background:var(--bad)}
#pwTxt{font-size:12px;color:var(--muted)}
#goalBtn{background:var(--accent);color:var(--accent-ink);border-color:transparent}
#hint{position:fixed;z-index:4;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  top:calc(env(safe-area-inset-top,0px) + 54px);pointer-events:none;display:flex;justify-content:center}
#hint span{background:rgba(13,17,21,.78);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12.5px;color:#cfd6dc;max-width:520px;text-align:center;text-wrap:balance}

#dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(8px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:stretch}
#tools{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;width:64px;height:66px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;position:relative}
.tool .ic{font-size:22px;line-height:1}
.tool .nm{font-size:10px;font-weight:600;color:#cdd5dc;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .cs{display:flex;gap:3px;font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tool.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#3a2f17}
.tool.poor .cs{color:var(--bad)}
.tool.poor .ic{opacity:.55}
.dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:2px;vertical-align:middle;border:1px solid #0008}
#rotBtn{flex:0 0 auto;width:58px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:var(--font-d);font-weight:700}
#rotBtn b{font-size:24px;line-height:1;color:var(--accent)}
#rotBtn small{font-size:10px;color:var(--muted);font-family:var(--font-b);font-weight:600}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-height:68%;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;box-shadow:0 -10px 30px #0008;padding-bottom:env(safe-area-inset-bottom,0px)}
.sh-h{display:flex;align-items:center;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.sh-h h2{flex:1;margin:0;font:700 19px/1.2 var(--font-d);letter-spacing:.02em;text-wrap:balance}
#sheetX{width:36px;height:36px;border-radius:10px;background:var(--panel2);font-size:16px}
#sheetBody{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.pill.ok{border-color:#2f6b4a}
.pill.no{border-color:#6b2f2a}
.act{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:600}
.act.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.act.dng{border-color:#7a3530;color:#ffb3aa}
.act[disabled]{opacity:.4;pointer-events:none}
.act.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.status{font-family:var(--font-d);font-weight:700;font-size:14px}
.status.good{color:var(--good)} .status.bad{color:var(--bad)} .status.warn{color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.inv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;background:var(--panel2);font-variant-numeric:tabular-nums}
.inv b{font-family:var(--font-d)}
.ms{padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ms.cur{border-color:var(--accent)}
.ms.done{opacity:.55}
.ms h3{margin:0;font:700 16px var(--font-d)}
.ms p{margin:0;color:var(--muted);font-size:12.5px}
.prog{height:6px;border-radius:3px;background:#0006;overflow:hidden;flex:1;min-width:40px}
.prog i{display:block;height:100%;background:var(--accent)}
.req{display:flex;align-items:center;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.req span:first-child{width:130px;flex:0 0 auto}
.help p{margin:0 0 8px;color:#cfd6dc;max-width:65ch}
.help b{color:var(--fg)}

#toast{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);pointer-events:none;
  background:#0d1115ee;border:1px solid var(--line);padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;opacity:0;transition:opacity .25s;max-width:86vw;text-align:center}
#toast.show{opacity:1}
#win{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#05070acc;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
#win div{max-width:420px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
#win h1{margin:0;font:700 30px/1.1 var(--font-d);color:var(--accent);text-wrap:balance}
#win p{margin:0;color:#cfd6dc}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<canvas id="cv"></canvas>
<div id="hud">
  <div class="chip" id="pwChip" title="Énergie"><span>⚡</span><div class="bar"><i id="pwBar"></i></div><span id="pwTxt">0/30 MW</span></div>
  <button class="chip btn" id="goalBtn" aria-label="Objectifs">🎯 <span id="goalTxt">P1</span></button>
  <button class="chip btn" id="invBtn" aria-label="Inventaire">🎒</button>
  <button class="chip btn" id="menuBtn" aria-label="Menu">☰</button>
</div>
<div id="hint"><span id="hintTxt"></span></div>
<div id="dock">
  <div id="tools"></div>
  <button id="rotBtn" aria-label="Tourner"><b id="rotArrow">→</b><small>Tourner</small></button>
</div>
<div id="sheet" hidden>
  <div class="sh-h"><h2 id="sheetTitle"></h2><button id="sheetX" aria-label="Fermer">✕</button></div>
  <div id="sheetBody"></div>
</div>
<div id="toast"></div>
<div id="win" hidden><div>
  <h1>Projet Ascension lancé</h1>
  <p>Ta fusée a quitté la planète. L'usine continue de tourner : agrandis-la autant que tu veux.</p>
  <button class="act pri" id="winOk">Continuer à construire</button>
</div></div>

<script>
(() => {
'use strict';

/* ---------- Données du jeu ---------- */
const W = 72, H = 72;
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
const ARROWS = ['→', '↓', '←', '↑'];
const SAVE_KEY = 'usine-orbitale-v1';
const HUB_POWER = 30, GEN_POWER = 60, GEN_BURN = 5;
const STORAGE_CAP = 300, MINER_BUF = 8;

// s : 0 = minerai (rond), 1 = lingot (carré), 2 = pièce (losange)
const ITEMS = {
  iron_ore:    { n: 'Minerai de fer',    c: '#c0583f', s: 0 },
  copper_ore:  { n: 'Minerai de cuivre', c: '#e8913f', s: 0 },
  limestone:   { n: 'Calcaire',          c: '#e6dfc8', s: 0 },
  coal:        { n: 'Charbon',           c: '#2b2b31', s: 0 },
  iron_ingot:  { n: 'Lingot de fer',     c: '#a3adb7', s: 1 },
  copper_ingot:{ n: 'Lingot de cuivre',  c: '#d9773a', s: 1 },
  plate:       { n: 'Plaque de fer',     c: '#d3dae0', s: 2 },
  rod:         { n: 'Tige de fer',       c: '#7f8d99', s: 2 },
  screw:       { n: 'Vis',               c: '#b3bcc4', s: 2 },
  wire:        { n: 'Fil de cuivre',     c: '#f3b06a', s: 2 },
  cable:       { n: 'Câble',             c: '#3f7cc0', s: 2 },
  concrete:    { n: 'Béton',             c: '#9a9a94', s: 1 },
  rplate:      { n: 'Plaque renforcée',  c: '#6a8fb2', s: 2 },
  rotor:       { n: 'Rotor',             c: '#d4ad2a', s: 2 },
  frame:       { n: 'Cadre modulaire',   c: '#8b6cc2', s: 2 },
  motor:       { n: 'Moteur',            c: '#d2503a', s: 2 },
};
const NODE_TYPES = ['iron_ore', 'copper_ore', 'limestone', 'coal'];

const RECIPES = {
  smelter: [
    { id: 'iron_ingot',   in: { iron_ore: 1 },   out: ['iron_ingot', 1],   t: 2 },
    { id: 'copper_ingot', in: { copper_ore: 1 }, out: ['copper_ingot', 1], t: 2 },
  ],
  constructor: [
    { id: 'plate',    in: { iron_ingot: 3 },   out: ['plate', 2],    t: 4 },
    { id: 'rod',      in: { iron_ingot: 1 },   out: ['rod', 1],      t: 3 },
    { id: 'screw',    in: { rod: 1 },          out: ['screw', 4],    t: 4, tier: 1 },
    { id: 'wire',     in: { copper_ingot: 1 }, out: ['wire', 2],     t: 3, tier: 2 },
    { id: 'cable',    in: { wire: 2 },         out: ['cable', 1],    t: 2, tier: 2 },
    { id: 'concrete', in: { limestone: 3 },    out: ['concrete', 1], t: 4, tier: 2 },
  ],
  assembler: [
    { id: 'rplate', in: { plate: 4, screw: 8 },  out: ['rplate', 1], t: 8,  tier: 3 },
    { id: 'rotor',  in: { rod: 4, screw: 16 },   out: ['rotor', 1],  t: 10, tier: 3 },
    { id: 'frame',  in: { rplate: 2, rod: 6 },   out: ['frame', 1],  t: 12, tier: 4 },
    { id: 'motor',  in: { rotor: 2, cable: 4 },  out: ['motor', 1],  t: 12, tier: 4 },
  ],
};
const RMAP = {};
for (const k in RECIPES) for (const r of RECIPES[k]) RMAP[k + ':' + r.id] = r;

const BUILD = {
  belt:        { n: 'Convoyeur',     ic: '⏩', col: '#353b44', cost: { plate: 1 }, speed: 1.6,
                 d: 'Glisse le doigt pour tracer une ligne. Les objets avancent dans le sens des chevrons.' },
  miner:       { n: 'Foreuse',       ic: '⛏️', col: '#8a6a32', cost: { plate: 6, rod: 2 }, power: 4, rate: 0.5,
                 d: 'À poser sur un gisement. Extrait 30 minerais/min vers l’avant.' },
  smelter:     { n: 'Fonderie',      ic: '🔥', col: '#9c3f2b', cost: { plate: 3, rod: 5 }, power: 4,
                 d: 'Fond le minerai en lingots. Choisit sa recette selon le minerai reçu.' },
  constructor: { n: 'Constructeur',  ic: '⚙️', col: '#2d6886', cost: { plate: 6, rod: 6 }, power: 4,
                 d: 'Transforme un type d’objet en pièce. Touche-le pour choisir la recette.' },
  splitter:    { n: 'Répartiteur',   ic: '🔀', col: '#4a5662', cost: { plate: 2, rod: 2 }, tier: 1,
                 d: 'Distribue les objets à tour de rôle devant, à gauche et à droite.' },
  storage:     { n: 'Conteneur',     ic: '📦', col: '#6c5a35', cost: { plate: 10, rod: 6 }, tier: 1,
                 d: 'Stocke 300 objets et les ressort vers l’avant s’il y a un convoyeur.' },
  generator:   { n: 'Générateur',    ic: '⚡', col: '#3b4049', cost: { plate: 15, screw: 20 }, tier: 2, gen: GEN_POWER,
                 d: 'Brûle du charbon : +60 MW. Un charbon dure 5 s à pleine charge.' },
  assembler:   { n: 'Assembleuse',   ic: '🛠️', col: '#57478a', cost: { plate: 20, screw: 30, cable: 10 }, tier: 3, power: 12,
                 d: 'Combine deux types d’objets. Touche-la pour choisir la recette.' },
  miner2:      { n: 'Foreuse Mk2',   ic: '⛏️', col: '#b08420', cost: { rplate: 4, cable: 8, concrete: 8 }, tier: 4, power: 10, rate: 1.25,
                 d: '75 minerais/min. Pose-la sur une Foreuse pour l’améliorer.' },
  belt2:       { n: 'Convoyeur Mk2', ic: '⏭️', col: '#3f3758', cost: { plate: 1, screw: 2 }, tier: 4, speed: 3.4,
                 d: 'Deux fois plus rapide. Trace-le par-dessus un convoyeur pour l’améliorer.' },
  hub:         { n: 'QG — Rampe de lancement', ic: '🚀', col: '#2a2f36', cost: {}, size: 3 },
};
const BUILD_ORDER = ['belt', 'miner', 'smelter', 'constructor', 'splitter', 'storage', 'generator', 'assembler', 'miner2', 'belt2'];

const MILESTONES = [
  { n: 'Fondations',        req: { plate: 60, rod: 40 },              unl: 'Répartiteur, Conteneur, recette Vis' },
  { n: 'Électrification',   req: { screw: 60, plate: 40 },            unl: 'Générateur à charbon, recettes Fil, Câble et Béton' },
  { n: 'Infrastructure',    req: { wire: 60, cable: 40, concrete: 40 }, unl: 'Assembleuse, Plaque renforcée, Rotor' },
  { n: 'Assemblage lourd',  req: { rplate: 15, rotor: 10 },           unl: 'Foreuse Mk2, Convoyeur Mk2, Cadre modulaire, Moteur' },
  { n: 'Projet Ascension',  req: { frame: 10, motor: 10 },            unl: 'Lancement de la fusée' },
];

// Établi : fabrication à la main depuis l'inventaire, pour ne jamais rester bloqué
const HAND = [
  { out: 'plate', n: 1, in: { iron_ore: 2 } },
  { out: 'rod',   n: 1, in: { iron_ore: 1 } },
  { out: 'screw', n: 4, in: { rod: 1 }, tier: 1 },
];

/* ---------- État ---------- */
let S = null;                 // état sauvegardé (hors bâtiments)
let list = [];                // bâtiments
let grid = new Array(W * H).fill(null);
let nodes = new Uint8Array(W * H);
let hub = null;
let tool = 'inspect';
let selected = null;          // bâtiment inspecté
let sheetMode = null;
let power = { supply: HUB_POWER, demand: 0, ratio: 1, load: 0 };
let floats = [];
let time = 0;

const idx = (x, y) => y * W + x;
const inb = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
const at = (x, y) => inb(x, y) ? grid[idx(x, y)] : null;
const isBelt = k => k === 'belt' || k === 'belt2';
const isMiner = k => k === 'miner' || k === 'miner2';
const isCrafter = k => k === 'smelter' || k === 'constructor' || k === 'assembler';
const inv = i => S.inv[i] || 0;

function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

/* ---------- Carte ---------- */
function genMap(seed) {
  nodes.fill(0);
  const R = rng(seed);
  const hx = W >> 1, hy = H >> 1;
  const blob = (cx, cy, type, r) => {
    for (let y = Math.floor(cy - r - 1); y <= cy + r + 1; y++)
      for (let x = Math.floor(cx - r - 1); x <= cx + r + 1; x++) {
        if (!inb(x, y)) continue;
        if (Math.abs(x - hx) <= 3 && Math.abs(y - hy) <= 3) continue;
        const d = Math.hypot(x - cx, y - cy);
        if (d < r * (0.75 + R() * 0.45)) nodes[idx(x, y)] = type + 1;
      }
  };
  // gisements garantis près du QG
  const near = [[0, 7, -2], [1, -8, 3], [2, 2, 8], [3, -3, -8], [0, -6, -5]];
  for (const [t, ox, oy] of near) blob(hx + ox + (R() * 2 - 1), hy + oy + (R() * 2 - 1), t, 1.8 + R() * 0.6);
  const counts = [12, 9, 8, 8];
  counts.forEach((c, t) => {
    for (let i = 0; i < c; i++) {
      let x, y, tries = 0;
      do { x = 3 + R() * (W - 6); y = 3 + R() * (H - 6); tries++; } while (Math.hypot(x - hx, y - hy) < 12 && tries < 50);
      blob(x, y, t, 1.4 + R() * 1.9);
    }
  });
  renderGround(seed);
}

const TS = 16;
const groundC = document.createElement('canvas');
function renderGround(seed) {
  groundC.width = W * TS; groundC.height = H * TS;
  const g = groundC.getContext('2d');
  const R = rng(seed ^ 0x9e37);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const n = Math.sin(x * 0.21 + seed) * Math.cos(y * 0.17 - seed * 0.5) * 0.5 + R() * 0.35;
    const l = 15 + n * 4;
    g.fillStyle = `hsl(${158 + n * 14} 14% ${l}%)`;
    g.fillRect(x * TS, y * TS, TS, TS);
  }
  // cailloux décoratifs
  for (let i = 0; i < W * H * 0.08; i++) {
    g.fillStyle = `hsla(150 10% ${22 + R() * 10}% / .6)`;
    g.fillRect(Math.floor(R() * W * TS), Math.floor(R() * H * TS), 1 + (R() * 2 | 0), 1 + (R() * 2 | 0));
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const t = nodes[idx(x, y)]; if (!t) continue;
    const col = ITEMS[NODE_TYPES[t - 1]].c;
    g.fillStyle = 'rgba(0,0,0,.28)';
    g.fillRect(x * TS, y * TS, TS, TS);
    for (let k = 0; k < 4; k++) {
      const px = x * TS + 2 + R() * (TS - 7), py = y * TS + 2 + R() * (TS - 7), s = 3 + R() * 3;
      g.fillStyle = col;
      g.beginPath(); g.moveTo(px, py + s * .5); g.lineTo(px + s * .5, py); g.lineTo(px + s, py + s * .4); g.lineTo(px + s * .7, py + s); g.lineTo(px + s * .1, py + s * .9); g.closePath(); g.fill();
      g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(px + s * .4, py + s * .2, 1, 1);
    }
  }
}

/* ---------- Bâtiments ---------- */
function make(k, x, y, d) {
  const b = { k, x, y, d };
  if (isBelt(k) || k === 'splitter') { b.it = null; b.p = 0; b.rr = 0; }
  if (isMiner(k)) { b.p = 0; b.on = 0; }
  if (isCrafter(k)) { b.r = k === 'smelter' ? 'iron_ingot' : k === 'constructor' ? 'plate' : 'rplate'; b.ib = {}; b.on = 0; b.cr = false; b.p = 0; }
  if (k === 'generator') { b.fuel = 0; b.burn = 0; }

  if (tool === 'delete') { if (b) demolish(b); return; }
  const nb = tryPlace(tool, tx, ty, S.rot, false);
}

/* ---------- Interface ---------- */
const $ = id => document.getElementById(id);
const toolsEl = $('tools');
let dirtyTools = true;
function costHTML(cost) {
  return Object.entries(cost).map(([i, n]) => `<span><i class="dot" style="background:${ITEMS[i].c}"></i>${n}</span>`).join('');
}
function buildTools() {
  const items = [
    { id: 'inspect', ic: '👆', n: 'Inspecter' },
    { id: 'delete', ic: '🗑️', n: 'Démolir' },
    ...BUILD_ORDER.filter(unlocked).map(k => ({ id: k, ic: BUILD[k].ic, n: BUILD[k].n, cost: BUILD[k].cost })),
  ];
  toolsEl.innerHTML = items.map(t => `<button class="tool${t.id === tool ? ' sel' : ''}${t.cost && !afford(t.cost) ? ' poor' : ''}" data-tool="${t.id}">
    <span class="ic">${t.ic}</span><span class="nm">${t.n}</span>${t.cost ? `<span class="cs">${costHTML(t.cost)}</span>` : ''}</button>`).join('');
  dirtyTools = false;
}
function refreshAfford() {
  for (const el of toolsEl.children) {
    const k = el.dataset.tool; if (!BUILD[k]) continue;
    el.classList.toggle('poor', !afford(BUILD[k].cost));
  }
}
toolsEl.addEventListener('click', e => {
  const el = e.target.closest('.tool'); if (!el) return;
  const id = el.dataset.tool;
  tool = (tool === id && id !== 'inspect') ? 'inspect' : id;
  for (const c of toolsEl.children) c.classList.toggle('sel', c.dataset.tool === tool);
  if (BUILD[tool]) toast(BUILD[tool].n + ' — ' + BUILD[tool].d, 3200);
  else if (tool === 'delete') toast('Touche ou glisse sur un bâtiment pour le démolir (remboursé)');
  if (sheetMode) closeSheet();
});
function updateRot() { $('rotArrow').textContent = ARROWS[S.rot]; }
$('rotBtn').addEventListener('click', () => { S.rot = (S.rot + 1) % 4; updateRot(); });

let toastT = 0;
function toast(msg, ms = 2200) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
}

// Panneau
const sheet = $('sheet'), sheetBody = $('sheetBody');
let sheetPress = false;
sheet.addEventListener('pointerdown', () => { sheetPress = true; });
window.addEventListener('pointerup', () => setTimeout(() => { sheetPress = false; }, 120));
function openSheet(mode, title) { sheetMode = mode; $('sheetTitle').textContent = title; sheet.hidden = false; renderSheet(); }
function closeSheet() { sheet.hidden = true; sheetMode = null; selected = null; }
$('sheetX').addEventListener('click', closeSheet);

function openBuilding(b) {
  if (b.k === 'hub') { selected = b; openGoals(); return; }
  selected = b; openSheet('building', BUILD[b.k].n);
}
function openGoals() { openSheet('goals', 'Objectifs du QG'); }
function openInv() { selected = null; openSheet('inv', 'Inventaire & établi'); }
function openMenu() { selected = null; openSheet('menu', 'Usine Orbitale'); }
$('goalBtn').addEventListener('click', () => sheetMode === 'goals' ? closeSheet() : openGoals());
$('invBtn').addEventListener('click', () => sheetMode === 'inv' ? closeSheet() : openInv());
$('menuBtn').addEventListener('click', () => sheetMode === 'menu' ? closeSheet() : openMenu());

const itemPill = (i, n, cls = '') => `<span class="pill ${cls}"><i class="dot" style="background:${ITEMS[i].c}"></i>${ITEMS[i].n} <b>${n}</b></span>`;
const ioLine = (io) => Object.entries(io).map(([i, n]) => `${n} ${ITEMS[i].n}`).join(' + ');

function statusOf(b) {
  if (isMiner(b.k)) {
    if (!b.working) return ['Sortie bloquée — branche un convoyeur devant', 'bad'];
    if (power.ratio < 1) return ['Énergie insuffisante (' + Math.round(power.ratio * 100) + ' %)', 'warn'];
    return ['Extraction en cours', 'good'];
  }
  if (isCrafter(b.k)) {
    const r = recipeOf(b);
    if (b.cr) return power.ratio < 1 ? ['Énergie insuffisante (' + Math.round(power.ratio * 100) + ' %)', 'warn'] : ['Production en cours', 'good'];
    if (r && b.on + r.out[1] > r.out[1] * 3) return ['Sortie bloquée', 'bad'];
    return ['En attente d’ingrédients', 'warn'];
  }
  if (b.k === 'generator') return b.burn > 0 ? ['Produit 60 MW', 'good'] : ['À l’arrêt — apporte du charbon', 'bad'];
  if (b.k === 'storage') return [b.cnt + ' / ' + STORAGE_CAP + ' objets', b.cnt >= STORAGE_CAP ? 'bad' : 'good'];
  return ['', ''];
}

function renderSheet() {
  if (!sheetMode) return;
  let h = '';
  if (sheetMode === 'building') {
    const b = selected; if (!b || !list.includes(b)) { closeSheet(); return; }
    const [st, cls] = statusOf(b);
    if (st) h += `<div class="status ${cls}">${st}</div>`;
    h += `<p style="margin:0;color:var(--muted);font-size:12.5px">${BUILD[b.k].d}</p>`;
    if (isMiner(b.k)) {
      const it = NODE_TYPES[nodes[idx(b.x, b.y)] - 1];
      h += `<div><div class="lbl">Gisement</div><div class="row">${itemPill(it, Math.round(BUILD[b.k].rate * 60) + '/min')}${itemPill(it, b.on, '')}</div></div>`;
    }
    if (isCrafter(b.k)) {
      const r = recipeOf(b);
      h += `<div><div class="lbl">Recette</div><div class="row">` + RECIPES[b.k].map(q => {
        const lock = (q.tier || 0) > S.tier;
        return `<button class="act${b.r === q.id ? ' on' : ''}" data-act="recipe:${q.id}" ${lock ? 'disabled' : ''}><i class="dot" style="background:${ITEMS[q.out[0]].c}"></i>${ITEMS[q.out[0]].n}${lock ? ' 🔒' : ''}</button>`;
      }).join('') + `</div></div>`;
      if (r) {
        const perMin = (n) => +(n * 60 / r.t).toFixed(1);
        h += `<div><div class="lbl">Entrées (${Object.entries(r.in).map(([i, n]) => perMin(n) + ' ' + ITEMS[i].n.toLowerCase() + '/min').join(', ')})</div><div class="row">` +
          Object.keys(r.in).map(i => itemPill(i, (b.ib[i] || 0) + ' / ' + r.in[i], (b.ib[i] || 0) >= r.in[i] ? 'ok' : 'no')).join('') + `</div></div>`;
        h += `<div><div class="lbl">Sortie (${perMin(r.out[1])}/min)</div><div class="row">${itemPill(r.out[0], b.on)}</div></div>`;
      }
    }
    if (b.k === 'generator') h += `<div><div class="lbl">Combustible</div><div class="row">${itemPill('coal', b.fuel + ' / 10')}</div></div>`;
    if (b.k === 'storage') {
      const ent = Object.entries(b.st);
      h += `<div><div class="lbl">Contenu</div><div class="row">${ent.length ? ent.map(([i, n]) => itemPill(i, n)).join('') : '<span style="color:var(--muted)">Vide</span>'}</div></div>`;
      h += `<div class="row"><button class="act pri" data-act="empty" ${ent.length ? '' : 'disabled'}>Transférer vers l’inventaire</button></div>`;
    }
    h += `<div class="row">${b.k !== 'generator' ? `<button class="act" data-act="rotate">↻ Tourner (${ARROWS[b.d]})</button>` : ''}<button class="act dng" data-act="demolish">🗑️ Démolir</button></div>`;
  }
  if (sheetMode === 'goals') {
    h += `<p style="margin:0;color:var(--muted);font-size:12.5px">Tout ce qui arrive au QG 🚀 par convoyeur va dans l’inventaire. Livre les pièces demandées pour débloquer de nouvelles technologies.</p>`;
    MILESTONES.forEach((m, i) => {
      const done = i < S.tier, cur = i === S.tier;
      const ok = cur && afford(m.req);
      h += `<div class="ms${done ? ' done' : ''}${cur ? ' cur' : ''}"><h3>Palier ${i + 1} · ${m.n}${done ? ' ✓' : ''}</h3><p>Débloque : ${m.unl}</p>`;
      if (!done) h += Object.entries(m.req).map(([it, n]) => {
        const have = Math.min(n, inv(it));
        return `<div class="req"><span><i class="dot" style="background:${ITEMS[it].c}"></i>${ITEMS[it].n}</span><div class="prog"><i style="width:${have / n * 100}%"></i></div><b>${have}/${n}</b></div>`;
      }).join('');
      if (cur) h += `<button class="act pri" data-act="milestone" ${ok ? '' : 'disabled'}>Valider le palier</button>`;
      h += `</div>`;
      if (!done && !cur) return;
    });
  }
  if (sheetMode === 'inv') {
    const ent = Object.keys(ITEMS).filter(i => inv(i) > 0);
    h += `<div><div class="lbl">Inventaire du QG</div><div class="grid2">${ent.length ? ent.map(i => `<div class="inv"><span><i class="dot" style="background:${ITEMS[i].c}"></i>${ITEMS[i].n}</span><b>${inv(i)}</b></div>`).join('') : '<span style="color:var(--muted)">Vide</span>'}</div></div>`;
    h += `<div><div class="lbl">Établi (fabrication à la main)</div><div style="display:flex;flex-direction:column;gap:6px">` + HAND.filter(c => (c.tier || 0) <= S.tier).map((c, k) =>
      `<div class="inv"><span>${ioLine(c.in)} → <b>${c.n} ${ITEMS[c.out].n}</b></span><span class="row"><button class="act" data-act="hand:${k}:1" ${afford(c.in) ? '' : 'disabled'}>×1</button><button class="act" data-act="hand:${k}:5" ${afford(c.in, 5) ? '' : 'disabled'}>×5</button></span></div>`).join('') +
      `</div><p style="margin:8px 0 0;color:var(--muted);font-size:12.5px">Astuce : en mode Inspecter 👆, touche un gisement pour ramasser du minerai à la main.</p></div>`;
  }
  if (sheetMode === 'menu') {
    h += `<div class="help">
      <p><b>But :</b> construis une usine automatisée sur cette planète et livre les pièces du Projet Ascension au QG 🚀.</p>
      <p><b>Déplacer :</b> glisse un doigt (mode Inspecter) ou deux doigts (n’importe quel mode). <b>Zoom :</b> pince l’écran.</p>
      <p><b>Construire :</b> choisis un bâtiment en bas, règle l’orientation avec <b>Tourner</b>, puis touche la carte. La flèche orange indique la sortie.</p>
      <p><b>Convoyeurs :</b> glisse le doigt pour tracer une ligne, elle s’oriente toute seule. Ils peuvent entrer dans un bâtiment par n’importe quel côté sauf la sortie.</p>
      <p><b>Chaîne de base :</b> Foreuse sur fer → Fonderie → Constructeur (Plaques ou Tiges) → QG.</p>
      <p><b>Énergie :</b> le QG fournit 30 MW. Au-delà, les machines ralentissent : construis des Générateurs à charbon.</p>
      <p><b>Démolir</b> rembourse tout le coût et le contenu.</p></div>`;
    h += `<div class="row"><button class="act" data-act="save">💾 Sauvegarder</button><button class="act" data-act="center">🎯 Centrer sur le QG</button><button class="act dng" data-act="reset">${resetArm ? 'Confirmer : tout effacer ?' : 'Nouvelle partie'}</button></div>`;
    h += `<p style="margin:0;color:var(--muted);font-size:12px">Sauvegarde automatique sur cet appareil toutes les 20 s.</p>`;
  }
  sheetBody.innerHTML = h;
}
let resetArm = false;
sheetBody.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const [a, p1, p2] = el.dataset.act.split(':');
  const b = selected;
  if (a === 'recipe' && b) {
    if (b.r !== p1) { for (const i in b.ib) give(i, b.ib[i]); const r = recipeOf(b); if (r) give(r.out[0], b.on); b.ib = {}; b.on = 0; b.cr = false; b.p = 0; b.r = p1; }
  }
  if (a === 'rotate' && b) b.d = (b.d + 1) % 4;
  if (a === 'demolish' && b) { demolish(b); return; }
  if (a === 'empty' && b) { for (const i in b.st) give(i, b.st[i]); b.st = {}; b.cnt = 0; toast('Contenu transféré vers l’inventaire'); }
  if (a === 'milestone') completeMilestone();
  if (a === 'hand') {
    const c = HAND.filter(c => (c.tier || 0) <= S.tier)[+p1], n = +p2;
    if (c && afford(c.in, n)) { for (const i in c.in) S.inv[i] -= c.in[i] * n; give(c.out, c.n * n); toast(`+${c.n * n} ${ITEMS[c.out].n}`); }
  }
  if (a === 'save') { save(); toast('Partie sauvegardée'); }
  if (a === 'center') { cam.x = W / 2; cam.y = H / 2; cam.z = 36; closeSheet(); return; }
  if (a === 'reset') {
    if (!resetArm) { resetArm = true; setTimeout(() => { resetArm = false; if (sheetMode === 'menu') renderSheet(); }, 4000); }
    else { resetArm = false; newGame(); closeSheet(); toast('Nouvelle planète générée'); return; }
  }
  dirtyTools = true;
  renderSheet();
});

function completeMilestone() {
  const m = MILESTONES[S.tier]; if (!m || !afford(m.req)) return;
  pay(m.req); S.tier++;
  toast('Palier « ' + m.n + ' » validé ! Débloqué : ' + m.unl, 4000);
  if (hub) floatTxt(hub.x + 1.5, hub.y + .8, '★ Palier ' + S.tier, '#f2a516');
  dirtyTools = true;
  if (S.tier >= MILESTONES.length && !S.won) { S.won = true; closeSheet(); $('win').hidden = false; }
  save();
}
$('winOk').addEventListener('click', () => { $('win').hidden = true; });

function updateHUD() {
  const p = power;
  $('pwTxt').textContent = Math.round(p.demand) + '/' + p.supply + ' MW';
  $('pwBar').style.width = Math.min(100, p.demand / p.supply * 100) + '%';
  $('pwChip').classList.toggle('over', p.demand > p.supply);
  const m = MILESTONES[S.tier];
  $('goalTxt').textContent = m ? 'P' + (S.tier + 1) + (afford(m.req) ? ' ✓' : '') : '★';
  $('hintTxt').textContent = hintText();
  $('hint').hidden = !$('hintTxt').textContent;
}
function hintText() {
  const has = k => list.some(b => b.k === k);
  if (tool !== 'inspect' && tool !== 'delete' && BUILD[tool]) {
    if (isBelt(tool)) return 'Glisse le doigt pour tracer des convoyeurs · deux doigts pour déplacer la vue';
    return 'Touche la carte pour poser : ' + BUILD[tool].n + ' (sortie ' + ARROWS[S.rot] + ')';
  }
  if (S.tier === 0) {
    if (!has('miner')) return '① Choisis la Foreuse ⛏️ et pose-la sur un gisement de fer (pierres rouges).';
    if (!has('smelter')) return '② Pose une Fonderie 🔥 et relie la foreuse avec des Convoyeurs.';
    if (!has('constructor')) return '③ Un Constructeur ⚙️ transforme les lingots en Plaques ou en Tiges.';
    if (!S.made.plate && !S.made.rod) return '④ Relie la sortie du Constructeur au QG 🚀 au centre.';
    if (afford(MILESTONES[0].req)) return 'Palier prêt ! Touche 🎯 pour le valider.';
    return 'Livre 60 plaques et 40 tiges au QG. Astuce : un constructeur par recette.';
  }
  const m = MILESTONES[S.tier];
  if (!m) return '';
  if (afford(m.req)) return 'Palier prêt ! Touche 🎯 pour le valider.';
  if (S.tier === 2 && !has('generator')) return 'Ton usine grossit : pose des Générateurs ⚡ alimentés en charbon.';
  return 'Palier ' + (S.tier + 1) + ' · ' + Object.entries(m.req).map(([i, n]) => ITEMS[i].n + ' ' + Math.min(n, inv(i)) + '/' + n).join(' · ');
}

/* ---------- Sauvegarde ---------- */
function serialize() {
  return { v: 1, S, cam: { ...cam }, b: list.filter(b => b.k !== 'hub') };
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(serialize())); } catch (e) { } }
function loadData(d) {
  try {
    if (!d || d.v !== 1 || !d.S) return false;
    S = Object.assign(freshState(), d.S);
    list = []; grid.fill(null);
    genMap(S.seed);
    placeHub();
    for (const b of d.b) if (BUILD[b.k] && inb(b.x, b.y) && !at(b.x, b.y)) addB(b);
    Object.assign(cam, d.cam || {});
    return true;
  } catch (e) { return false; }
}
function freshState() {
  return { seed: (Math.random() * 1e9) | 0, tier: 0, inv: { plate: 40, rod: 24 }, rot: 0, made: {}, won: false, handHint: 0 };
}
function placeHub() { hub = make('hub', (W >> 1) - 1, (H >> 1) - 1, 0); addB(hub); }
function newGame() {
  S = freshState(); list = []; grid.fill(null);
  genMap(S.seed); placeHub();
  cam.x = W / 2; cam.y = H / 2; cam.z = 36;
  tool = 'inspect'; dirtyTools = true; updateRot(); save();
}

/* ---------- Boucle ---------- */
let last = 0, acc = 0, uiT = 0, saveT = 0;
function frame(t) {
  const dt = Math.min(0.25, (t - last) / 1000 || 0); last = t;
  let rem = dt; while (rem > 0) { const d = Math.min(0.05, rem); step(d); rem -= d; }
  for (const f of floats) f.t += dt * 1.2;
  render();
  uiT += dt; saveT += dt;
  if (dirtyTools) { buildTools(); }
  if (uiT > 0.3) {
    uiT = 0; updateHUD(); refreshAfford();
    if (sheetMode && !sheetPress) renderSheet();
  }
  if (saveT > 20) { saveT = 0; save(); }
  requestAnimationFrame(frame);
}

function start(hot) {
  resize();
  window.addEventListener('resize', resize);
  let ok = hot && loadData(hot);
  if (!ok) { try { ok = loadData(JSON.parse(localStorage.getItem(SAVE_KEY) || 'null')); } catch (e) { ok = false; } }
  if (!ok) { newGame(); setTimeout(() => toast('Bienvenue ! Suis les consignes en haut de l’écran.', 3500), 400); }
  updateRot(); buildTools(); updateHUD();
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
  try { window.claude?.hot?.snapshot?.(() => serialize()); } catch (e) { }
  requestAnimationFrame(t => { last = t; frame(t); });
}
if (location.hash === '#test') window.__t = { tryPlace, step, get list() { return list; }, get S() { return S; }, hub: () => hub, nodes, NODE_TYPES, W };
const hotApi = window.claude && window.claude.hot;
if (hotApi && hotApi.ready) hotApi.ready(start); else start(hotApi && hotApi.data);
})();
</script>
<!--ART-END-->
</body>
